<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Iniciar sesión - Gallo Alerta</title>
</head>

<body>
    <div class="bg-secondary text-light p-5">
        <h1>Iniciar sesión</h1>
        <h5>Verifíquese para entrar al modo de administrador.</h5>
    </div>

    <!-- Formulario -->
    <div class="m-5">
        <form onsubmit="adminLogin(event)" class="mb-3">
            <div class="mb-3">
                <label for="usuario" class="form-label">Nombre de usuario</label>
                <input type="text" class="form-control" id="usuario" required>
            </div>
            <div class="mb-3">
                <label for="contra" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contra" required>
            </div>
            <button type="submit" id="botonlogin" class="btn btn-danger">Iniciar sesión</button>
        </form>
        <div id="mensaje"></div>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="layout.js"></script>
</body>

</html>
