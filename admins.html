<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="layout.js"></script>
    <title>Gestionar administradores - Gallo Alerta</title>
</head>

<body>
    <div class="bg-secondary text-light p-5">
        <h1>Gestionar administradores</h1>
        <h5>Gestione usuarios con permiso para moderar y resolver incidentes.</h5>
    </div>

    <div class="m-5">
        <div class="overflow-auto">
            <h3>Administradores registrados</h3>
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>N.º</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Usuario</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Administrador Principal</td>
                        <td>admin@galloalerta.com</td>
                        <td>admin1234</td>
                        <td><span class="badge rounded-pill text-bg-success">Activo</span></td>
                        <td>
                            <div class="d-flex gap-1 flex-wrap">
                                <button class="btn btn-warning">
                                    <i class="bi bi-ban"></i>
                                </button>
                                <button class="btn btn-danger">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <h3>Registrar un nuevo administrador</h3>
        <form>
            <div class="mb-3">
                <div class="row">
                    <div class="col">
                        <label for="nombape" class="form-label">Nombre y apellido</label>
                        <input type="text" id="nombape" class="form-control" placeholder="Ejemplo: Carlos Gómez" required>
                    </div>
                    <div class="col">
                        <label for="email" class="form-label">Dirección de correo electrónico</label>
                        <input type="email" class="form-control" id="email" placeholder="Ejemplo: cgomez@galloalerta.com" required>
                    </div>
                </div>
            </div>
            <div class="mb-3">
                <div class="row">
                    <div class="col">
                        <label for="usuario" class="form-label">Nombre de usuario</label>
                        <input type="text" id="usuario" class="form-control" placeholder="Ejemplo: cgomez" required>
                    </div>
                    <div class="col">
                        <label for="contra" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="contra" required>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn btn-danger">Registrar nuevo administrador</button>
        </form>
    </div>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="layout.js"></script>
</body>

</html>
