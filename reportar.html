<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Reportar incidente - Gallo Alerta</title>
</head>

<body>
    <!-- Formulario -->
    <div class="bg-secondary text-light p-5">
        <a href="inicio.html" class="link-light"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        <h1 class="mt-2">Reportar incidente</h1>
        <h5>Rellene los datos del incidente en el siguiente formulario.</h5>
    </div>
    <form class="m-5 mt-4">
        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" required class="form-control" id="asunto" placeholder="Ejemplos: Bache pronunciado en la calzada, luminaria rota sobre la vereda.">
        </div>
        <div class="mb-3">
            <label for="lugar" class="form-label">Calle o intersección del incidente</label>
            <input type="text" required class="form-control" id="lugar"
                placeholder="Ejemplos: Av. San Martín y Belgrano, Plaza Central">
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Categoría del incidente</label>
            <select class="form-select" id="tipo" required>
                <option selected></option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="detalles" class="form-label">Detalles del incidente (opcional)</label>
            <textarea class="form-control" id="detalles" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="fotos" class="form-label">Fotos o vídeos del incidente (opcional)</label>
            <input class="form-control" type="file" id="fotos" multiple accept="image/*, video/*">
        </div>
        <button class="btn btn-danger" type="submit">
            <i class="bi bi-megaphone-fill me-2"></i>Reportar incidente
        </button>
    </form>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="layout.js"></script>
</body>

</html>
