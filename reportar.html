<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Reportar incidente - Gallo Alerta</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar bg-danger sticky-top p-2">
        <div class="container-fluid">
            <a class="navbar-brand text-light" href="inicio.html">
                <img src="img/logo_white.png" alt="Logo" width="30" height="24"
                    class="d-inline-block align-text-top object-fit-contain me-1">
                Gallo Alerta
            </a>
            <a class="btn btn-danger" href="login.html">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Admin
            </a>
        </div>
    </nav>

    <!-- Formulario -->
    <div class="bg-secondary text-light p-5">
        <a href="inicio.html" class="link-light"><i class="bi bi-arrow-left me-1"></i>Volver</a>
        <h1 class="mt-2">Reportar incidente</h1>
        <h5>Rellene los datos del incidente en el siguiente formulario.</h5>
    </div>
    <form class="m-5 mt-4">
        <div class="mb-3">
            <label for="asunto" class="form-label">Asunto</label>
            <input type="text" required class="form-control" id="asunto" placeholder="Ejemplos: Bache pronunciado en la calzada, luminaria rota sobre la vereda.">
        </div>
        <div class="mb-3">
            <label for="lugar" class="form-label">Calle o intersección del incidente</label>
            <input type="text" required class="form-control" id="lugar"
                placeholder="Ejemplos: Av. San Martín y Belgrano, Plaza Central">
        </div>
        <div class="mb-3">
            <label for="tipo" class="form-label">Categoría del incidente</label>
            <select class="form-select" id="tipo" required>
                <option selected></option>
                <option value="1">One</option>
                <option value="2">Two</option>
                <option value="3">Three</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="detalles" class="form-label">Detalles del incidente (opcional)</label>
            <textarea class="form-control" id="detalles" rows="3"></textarea>
        </div>
        <div class="mb-3">
            <label for="fotos" class="form-label">Fotos o vídeos del incidente (opcional)</label>
            <input class="form-control" type="file" id="fotos" multiple accept="image/*, video/*">
        </div>
        <button class="btn btn-danger" type="submit">
            <i class="bi bi-megaphone-fill me-2"></i>Reportar incidente
        </button>
    </form>

    <!-- Footer -->
    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="inicio.html" class="nav-link px-2 text-body-secondary">Inicio</a></li>
                <li class="nav-item"><a href="incidentes.html" class="nav-link px-2 text-body-secondary">Incidentes</a>
                </li>
                <li class="nav-item"><a href="reportar.html" class="nav-link px-2 text-body-secondary">Reportar
                        incidente</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Normas</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Términos y condiciones</a>
                </li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Política de privacidad</a>
                </li>
            </ul>

            <div class="d-flex justify-content-between gap-3">
                <p class="text-body-secondary">© 2026 Grupo Salamanca. Todos los derechos reservados.</p>
                <div class="d-flex gap-3">
                    <a href="#"><i class="bi bi-facebook fs-3"></i></a>
                    <a href="#"><i class="bi bi-instagram fs-3"></i></a>
                    <a href="#"><i class="bi bi-twitter-x fs-3"></i></a>
                </div>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>

</html>
